name: scheduled-post

on:
  schedule:
    - cron: "7 0 * * *"   # 毎日 朝 09:07 JST (UTC 00:07)
    - cron: "7 12 * * *"  # 毎日 夜 21:07 JST (UTC 12:07)
  workflow_dispatch:
    inputs:
      send:
        description: "実際に投稿する (false なら確認のみ)"
        type: boolean
        default: false

permissions:
  contents: write   # 投稿したキューの行を消してコミットするため
  issues: write     # 結果を Issue にコメントして通知するため

concurrency:
  group: scheduled-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      # 定期実行(schedule)では常に投稿。手動実行では入力の値に従う
      SEND: ${{ github.event_name == 'schedule' || inputs.send }}
    steps:
      - uses: actions/checkout@v4

      - name: Post to X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          set -o pipefail
          flag=""; [ "$SEND" = "true" ] && flag="--send"
          if [ "$SEND" = "true" ] && [ -z "$X_API_KEY" ]; then echo "X のシークレット未設定のためスキップ" | tee /tmp/x.log; exit 0; fi
          python3 projects/x-poster/post.py --queue projects/x-poster/queue.txt $flag 2>&1 | tee /tmp/x.log

      # X が失敗しても、Threads は投稿する
      - name: Post to Threads
        if: ${{ !cancelled() }}
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: |
          set -o pipefail
          flag=""; [ "$SEND" = "true" ] && flag="--send"
          if [ "$SEND" = "true" ] && [ -z "$THREADS_ACCESS_TOKEN" ]; then echo "Threads のシークレット未設定のためスキップ" | tee /tmp/threads.log; exit 0; fi
          python3 projects/threads-poster/post.py --queue projects/threads-poster/queue.txt $flag 2>&1 | tee /tmp/threads.log

      - name: Commit updated queues
        if: ${{ !cancelled() && env.SEND == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/x-poster/queue.txt projects/threads-poster/queue.txt
          git diff --cached --quiet && exit 0
          git commit -m "Update post queues after scheduled post"
          git pull --rebase
          git push

      # 結果を Issue「投稿ログ」にコメントする(@メンションで通知が届く)
      - name: Notify result
        if: ${{ !cancelled() && env.SEND == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          summary() {
            f="$1"
            if [ ! -s "$f" ]; then echo "⚠️ 記録なし(実行されませんでした)"
            elif grep -q "投稿しました" "$f"; then echo "✅ 投稿しました — $(head -1 "$f")"
            elif grep -q "キューが空" "$f"; then echo "⚪ キューが空(投稿なし)"
            elif grep -q "スキップ" "$f"; then echo "⚪ スキップ(シークレット未設定)"
            else echo "❌ 失敗 — $(grep -m1 'エラー' "$f" || tail -n 1 "$f")"; fi
          }
          body="@${OWNER} 定期投稿の結果です($(TZ=Asia/Tokyo date '+%m/%d %H:%M') JST)

          - X: $(summary /tmp/x.log)
          - Threads: $(summary /tmp/threads.log)

          詳細: ${RUN_URL}"
          num=$(gh issue list --state open --search '投稿ログ in:title' --json number --jq '.[0].number // empty')
          if [ -z "$num" ]; then
            num=$(gh issue create --title "投稿ログ" --body "定期投稿の結果を、ここにコメントで残します。" | grep -o '[0-9]*$')
          fi
          gh issue comment "$num" --body "$body"
